<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Kingshot account dashboard</title>
<!--
  Kingshot account dashboard — static page for GitHub Pages.
  One self-contained file: styles, data (KS_DATA) and logic all live here.
  To update content, change only the JSON between /* KS_DATA:BEGIN */ and /* KS_DATA:END */.
  Schema: docs/SCHEMA.md. Design source: design/dashboard-prototype.dc.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0}
a{color:#1D57B5}a:hover{color:#123E85}
/* ---- Theme tokens: light is the default, dark via toggle or system preference ---- */
.ks{--bg:#F2F3F0;--surface:#FFFFFF;--surface-2:#F6F7F4;--track:#E2E5DF;--line:#D6DAD3;--ink:#15181C;--muted:#4F5761;--accent:#1D57B5;--accent-soft:#E3ECFA;--on-accent:#FFFFFF;--warn:#A64500;--warn-soft:#FCEBDD;--good:#1F6B47;--good-soft:#E1F1E8;--inf:#27467A;--cav:#C77A1E;--arc:#8DBBE3;--mythic:#B07D10;--epic:#7A3FB0;--rare:#2C6FCB;--scrim:rgba(10,12,15,.5)}
.ks.theme-dark{--bg:#0E1115;--surface:#161A20;--surface-2:#1C2128;--track:#2A313A;--line:#2C333C;--ink:#E7E9EC;--muted:#A2AAB4;--accent:#86B3FF;--accent-soft:#1B2A44;--on-accent:#0E1115;--warn:#FFAA66;--warn-soft:#3A2414;--good:#7FD3A6;--good-soft:#16302A;--inf:#4F7BC4;--cav:#E3A04E;--arc:#BFDDF5;--mythic:#E2B54A;--epic:#B98BEA;--rare:#7FB0F0;--scrim:rgba(0,0,0,.6)}
@media (prefers-color-scheme: dark){.ks.theme-auto{--bg:#0E1115;--surface:#161A20;--surface-2:#1C2128;--track:#2A313A;--line:#2C333C;--ink:#E7E9EC;--muted:#A2AAB4;--accent:#86B3FF;--accent-soft:#1B2A44;--on-accent:#0E1115;--warn:#FFAA66;--warn-soft:#3A2414;--good:#7FD3A6;--good-soft:#16302A;--inf:#4F7BC4;--cav:#E3A04E;--arc:#BFDDF5;--mythic:#E2B54A;--epic:#B98BEA;--rare:#7FB0F0;--scrim:rgba(0,0,0,.6)}}
.ks{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ks *{box-sizing:border-box}
.ks button{font:inherit;color:inherit}
.ks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ks h1,.ks h2,.ks h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;line-height:1.1}
/* ---- Header ---- */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.who{display:flex;flex-direction:column;gap:2px;flex:1 1 200px;min-width:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ks h1{font-size:30px;font-weight:700}
.age{display:flex;flex-direction:column;gap:1px;flex:0 1 auto}
.age-main{font-weight:600}
.age-sub{font-size:13px;color:var(--muted)}
.age-sub.warn{color:var(--warn);font-weight:600}
.theme-btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
/* ---- Shell: side menu on desktop, scrolling tab strip on phone ---- */
.shell{max-width:1280px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.nav{flex:1 1 190px;max-width:220px;display:flex;flex-direction:column;gap:2px}
.nav-btn{min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;white-space:nowrap}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent)}
.nav-badge{font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.nav-badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.view-h{display:flex;flex-direction:column;gap:2px}
.view-h h2{font-size:30px;font-weight:700}
.lede{margin:0;color:var(--muted)}
/* ---- Panels, tiles ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.panel-h h3{font-size:21px;font-weight:700}
.asof{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-l{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile-v{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:30px;line-height:1.1}
.tile-v.nr{font-size:20px;color:var(--muted)}
.tile-note{font-size:12.5px;font-weight:600;color:var(--warn)}
.tile-s{font-size:12px;color:var(--muted)}
.empty{margin:0;color:var(--muted);font-style:italic}
.foot{margin:0;font-size:13px;color:var(--muted)}
.note{margin:12px 0 0;font-size:14px}
.mini{font-size:12.5px;color:var(--muted)}
.mini.warn,.warntext{color:var(--warn);font-weight:600}
/* ---- Confidence + state badges: label text always present, shape differs too ---- */
.conf{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;padding:1px 8px;border-radius:99px;border:1.5px solid transparent;white-space:nowrap}
.conf-verified{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.conf-inferred{border-color:var(--accent);color:var(--accent)}
.conf-unverified,.conf-not-recorded{border-color:var(--warn);border-style:dashed;color:var(--warn)}
.badge-new{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--ink);color:var(--bg)}
.rar{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.rar::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--muted)}
.rar-mythic::before{background:var(--mythic)}.rar-epic::before{background:var(--epic)}.rar-rare::before{background:var(--rare)}
/* ---- Bars ---- */
.meter{display:flex;flex-direction:column;gap:4px}
.meter-l{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.meter-l b{color:var(--ink);font-weight:600}
.bar{display:block;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar-f{display:block;height:100%;border-radius:3px;background:var(--accent)}
.stack{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;background:var(--surface)}
.seg{display:block;height:100%}
.seg-inf{background:var(--inf)}.seg-cav{background:var(--cav)}.seg-arc{background:var(--arc)}
.legend{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;margin-top:12px;font-size:14px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.num{text-align:right;font-weight:600}
/* ---- Overview pieces ---- */
.moves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.move{width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;min-height:44px}
.move:hover{border-color:var(--accent)}
.move-n{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px;line-height:1;color:var(--accent)}
.move-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.move-t{font-weight:600;font-size:15.5px}
.move-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.row-btn:last-child{border-bottom:0}
.row-btn:hover .row-k{color:var(--accent)}
.row-k{font-weight:500}
.row-v{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;white-space:nowrap}
.row-v.warn{color:var(--warn)}
.agetbl{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;font-size:14px;align-items:baseline}
.agetbl .h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
/* ---- Filters ---- */
.fbar{display:flex;flex-direction:column;gap:8px}
.fgroup{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.flabel{flex:0 0 78px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* ---- Hero cards ---- */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:10px}
.hcard{width:100%;display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.hcard:hover{border-color:var(--accent)}
.hc-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.hc-name{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:23px;line-height:1}
.hc-power{margin-left:auto;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:19px}
.hc-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13.5px;color:var(--muted)}
.hc-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.hc-row b{color:var(--ink);font-weight:600}
.chips-s{display:flex;flex-wrap:wrap;gap:4px}
.chip-s{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.flag{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--warn)}
.flag svg{flex:none}
/* ---- Drawer: side panel on desktop, bottom sheet on phone ---- */
.drawer-wrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.scrim{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:var(--scrim);cursor:pointer}
.drawer{position:relative;width:min(460px,100%);height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.dr-h{display:flex;align-items:flex-start;gap:12px}
.dr-h h2{font-size:32px;font-weight:700}
.x-btn{margin-left:auto;flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dr-sec{display:flex;flex-direction:column;gap:8px}
.dr-sec h3{font-size:18px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0}
.slot-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.slot-row.bad{border-color:var(--warn);background:var(--warn-soft)}
.slot-row.bad .slot-st{color:var(--warn);font-weight:700}
.sk-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.sk-name{font-weight:600}
.sk-note{flex-basis:100%;font-size:13px;color:var(--muted)}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap}
.st-capped{color:var(--muted)}
.st-upgradeable{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st-progress{border-color:var(--accent);color:var(--accent)}
.st-locked{border-style:dashed;color:var(--muted)}
/* ---- Drill Camp ---- */
.instr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(112px,100%),1fr));gap:8px}
.instr-c{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.instr-c.lowest{border:2px solid var(--warn);background:var(--warn-soft)}
.instr-n{font-weight:600}
.instr-v{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:26px;line-height:1.05}
.lowtag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100px,100%),1fr));gap:6px}
.slot{display:flex;flex-direction:column;gap:1px;min-height:72px;padding:8px;border-radius:8px;font-size:12.5px;min-width:0}
.slot-n{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.slot-s{font-weight:600;font-size:14px}
.slot-d{color:var(--muted)}
.slot.open{border:1.5px dashed var(--accent)}
.slot.open .slot-s{color:var(--accent)}
.slot.filled{background:var(--accent-soft);border:1px solid var(--accent)}
.slot.locked{background:var(--surface-2);border:1px solid var(--line)}
.plan{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.plan li{padding-left:2px}
.plan-l{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.linkish{border:0;background:transparent;padding:0;min-height:32px;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.warnbox strong{color:var(--warn)}
.okbox{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--good-soft);font-size:14px}
/* ---- Army / Defense ---- */
.march{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.march-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.march-h h4{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:22px;font-weight:700}
.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px}
.form{display:flex;flex-direction:column;gap:6px}
.form-lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.form-row{display:grid;gap:6px}
.form-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fslot{display:flex;flex-direction:column;gap:1px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0;text-align:left;cursor:pointer;min-height:58px}
.fslot:hover{border-color:var(--accent)}
.fslot-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fslot-p{font-size:12.5px;color:var(--muted)}
.check{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:12px;font-size:14px}
.check .num.warn{color:var(--warn)}
/* ---- Features ---- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.feat{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.feat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.feat-h h4{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:700}
.state{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid transparent;white-space:nowrap}
.s-active{background:var(--good-soft);color:var(--good)}
.s-locked{background:var(--surface-2);border-color:var(--ink);color:var(--ink)}
.s-coming-soon{border-color:var(--accent);color:var(--accent)}
.s-unknown{border-color:var(--muted);border-style:dashed;color:var(--muted)}
.feat .kv{grid-template-columns:76px 1fr;font-size:13.5px}
/* ---- Lists (health, codes, invest) ---- */
.list{display:flex;flex-direction:column;gap:8px}
.item{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.item-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.item-t{font-weight:700}
.item-a{font-size:12.5px;color:var(--muted)}
.item p{margin:0;font-size:14px}
.rec{display:flex;flex-direction:column;gap:10px}
.rec-what{font-weight:700;font-size:16.5px;line-height:1.35}
.rec-heroes{display:flex;flex-wrap:wrap;gap:4px 10px}
.rec-ev{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.rec-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.chgs{display:flex;flex-direction:column;gap:8px}
.chg{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.chg-w{font-weight:700;font-size:14px}
.chg-r{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:14px;align-items:baseline}
.chg-l{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:78px}
.chg-t{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.chg-t th,.chg-t td{text-align:left;vertical-align:top;padding:4px 6px 4px 0;border-top:1px solid var(--line)}
.chg-t thead th{border-top:0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chg-t th[scope=row]{width:52px;font-weight:600;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tok{overflow-wrap:anywhere}
.tok-out{text-decoration:line-through;color:var(--muted)}
.tok-new{font-weight:700;color:var(--good)}
.move-c{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.move-c b{color:var(--good)}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:baseline;gap:10px}
.grp-h h3{font-size:22px;font-weight:700}
.codes{display:flex;flex-direction:column;font-size:15px}
/* One row per code: tap target is the whole row (≥44px), state on the right. */
.code-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;min-height:44px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;text-align:left;width:100%}
button.code-row{cursor:pointer}
button.code-row:hover .cbox{border-color:var(--accent)}
.cbox{width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1}
.code-row[aria-pressed=true] .cbox{background:var(--good);border-color:var(--good);color:var(--surface)}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.code-st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.code-local{font-size:11.5px;font-weight:600;color:var(--accent)}
.code-pend{margin-top:6px;color:var(--ink)}
.ok{color:var(--good);font-weight:700}
@media (max-width:760px){
.top-in{padding:12px}
.ks h1{font-size:25px}
.shell{padding:12px;gap:12px}
.nav{flex:1 1 100%;max-width:none;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
.nav-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface)}
.nav-btn.on{border-color:var(--accent)}
.view-h h2{font-size:26px}
.drawer-wrap{align-items:flex-end}
.drawer{width:100%;height:auto;max-height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
.kv{grid-template-columns:96px 1fr}
.tile-v{font-size:26px}
}

/* =====================================================================
 * State host.
 * Why: the dashboard logic above was designed around a tiny
 * "state + setState + re-render" contract. This shim provides exactly
 * that contract with no framework, so the logic stays unchanged and the
 * page remains one dependency-free file.
 * ===================================================================== */

/**
 * Minimal state container. Subclasses set `this.state` and call
 * `setState(patch)`; every change triggers a full re-render.
 */
class StateHost {
  /** Create an empty state host. */
  constructor() {
    this.state = {};
  }

  /**
   * Merge a partial state object and re-render.
   * @param {object} patch Keys to overwrite in `this.state`.
   * @returns {void}
   */
  setState(patch) {
    var prev = this.state;
    this.state = Object.assign({}, prev, patch);
    afterStateChange(prev, this.state);
    render();
  }
}

class Dashboard extends StateHost {
  /**
   * Create the dashboard with its initial UI state.
   */
  constructor() {
    super();
    // UI state only. Data never lives in state, so a regenerated KS_DATA always wins.
    // The one exception is `codeMarks`: the viewer's own "redeemed" marks, kept in this
    // browser and laid over codes.md until codes.md catches up (see codeBase/pruneCodeMarks).
    this.state = { view: 'overview', theme: 'auto', fCls: 'all', fRar: 'all', fGen: 'all', fRole: 'all', sort: 'power', hero: null, iType: 'all', iHero: 'all', codeMarks: {} };
  }

  /* ------------------------------------------------------------------
   * Gift-code marks.
   * Why: the page is static (GitHub Pages) and can't write to codes.md, so
   * a code the viewer marks here is stored in this browser only. A mark is
   * kept only while it differs from codes.md; once codes.md says the same,
   * the mark is dropped and the file is the source again.
   * ------------------------------------------------------------------ */

  /**
   * Redeemed state of every listed code, as recorded in codes.md.
   * @returns {Object<string, ?boolean>} Code → true / false / null (not recorded).
   */
  codeBase() {
    var c = (typeof KS_DATA === 'object' && KS_DATA && KS_DATA.codes) ? KS_DATA.codes : null;
    var base = {};
    if (!c) return base;
    (c.active || []).concat(c.expired || []).forEach(function (x) {
      // A code listed twice keeps its first (active) row.
      if (x && x.code && !Object.prototype.hasOwnProperty.call(base, x.code)) {
        base[x.code] = x.redeemed === true ? true : (x.redeemed === false ? false : null);
      }
    });
    return base;
  }

  /**
   * Keep only marks that are booleans, name a listed code and differ from codes.md.
   * @param {*} marks Saved marks (may come from storage, so any shape).
   * @returns {Object<string, boolean>} Clean marks.
   */
  pruneCodeMarks(marks) {
    var base = this.codeBase();
    var out = {};
    if (!marks || typeof marks !== 'object') return out;
    Object.keys(marks).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(base, k) && typeof marks[k] === 'boolean' && marks[k] !== base[k]) out[k] = marks[k];
    });
    return out;
  }

  /* ------------------------------------------------------------------
   * Formatting helpers. Every helper turns null/undefined into
   * "Not recorded" so no component can render a blank value.
   * ------------------------------------------------------------------ */

  /**
   * Format a number with thousands separators.
   * @param {?number} v
   * @returns {string}
   */
  num(v) {
    return (v === null || v === undefined || isNaN(v)) ? 'Not recorded' : Number(v).toLocaleString('en-US');
  }

  /**
   * Format a large number compactly (94.6M). Used where the source itself was rounded.
   * @param {?number} v
   * @returns {string}
   */
  compact(v) {
    if (v === null || v === undefined) return 'Not recorded';
    if (Math.abs(v) >= 1e6) return (Math.round(v / 1e5) / 10).toLocaleString('en-US') + 'M';
    if (Math.abs(v) >= 1e3) return (Math.round(v / 1e2) / 10).toLocaleString('en-US') + 'K';
    return String(v);
  }

  /**
   * Parse an ISO date (YYYY-MM-DD) as UTC midnight.
   * @param {?string} iso
   * @returns {?Date} null when missing or malformed
   */
  parse(iso) {
    if (!iso) return null;
    var d = new Date(iso + 'T00:00:00Z');
    return isNaN(d.getTime()) ? null : d;
  }

  /**
   * "21 Oct 2026" (long) or "21 Oct" (short).
   * @param {?string} iso
   * @param {boolean} short
   * @returns {string}
   */
  date(iso, short) {
    var d = this.parse(iso);
    if (!d) return 'date not recorded';
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getUTCDate() + ' ' + M[d.getUTCMonth()] + (short ? '' : ' ' + d.getUTCFullYear());
  }

  /**
   * Whole days between an as-of date and today (viewer's clock, UTC days).
   * @param {?string} iso
   * @returns {?number} null when the date is missing
   */
  ageDays(iso) {
    var d = this.parse(iso);
    if (!d) return null;
    var now = new Date();
    var today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    return Math.max(0, Math.floor((today - d.getTime()) / 86400000));
  }

  /**
   * Human age label: "today", "1 day old", "5 days old", "age unknown".
   * @param {?string} iso
   * @returns {string}
   */
  ageText(iso) {
    var n = this.ageDays(iso);
    if (n === null) return 'age unknown';
    if (n === 0) return 'today';
    return n === 1 ? '1 day old' : n + ' days old';
  }

  /**
   * "as of 21 Oct" with a fallback.
   * @param {?string} iso
   * @returns {string}
   */
  asOf(iso) {
    return iso ? 'as of ' + this.date(iso, true) : 'as of: Not recorded';
  }

  /**
   * Build template inputs. All derived values (caps, sums, conflicts,
   * placement plan, feature states) are computed here from KS_DATA.
   * @returns {object}
   */
  renderVals() {
    var self = this;
    var S = this.state;
    var D = (typeof KS_DATA === 'object' && KS_DATA) ? KS_DATA : {};
    var NR = 'Not recorded';
    var meta = D.meta || {};
    var gov = D.governor || {};
    var tcObj = D.townCenter || {};
    var res = D.resources || {};
    var army = D.army || {};
    var rules = D.rules || {};
    var L = D.lineups || {};
    var DC = D.drillCamp || null;
    var codesD = D.codes || null;
    var heroes = Array.isArray(D.heroes) ? D.heroes : [];
    var recsRaw = Array.isArray(D.recommendations) ? D.recommendations : [];
    var featsRaw = Array.isArray(D.features) ? D.features : [];
    var dh = D.dataHealth || {};
    // Per-part dates: each army tile takes its own row's date, and each march,
    // Arena squad and barricade its own section's date, because these are read
    // from different screens on different days. Data without these fields
    // falls back to the section dates.
    var armyField = army.fieldAsOf || {};
    var armyAsOf = function (k) { return armyField[k] || army.asOf; };
    var newestPart = function (parts, fallback) {
      var ds = (parts || []).map(function (p) { return p && p.asOf; }).filter(Boolean).sort();
      return ds.length ? ds[ds.length - 1] : fallback;
    };
    // A card older than its panel's date says so; cards as new as the panel stay quiet.
    var olderNote = function (part, panelIso) {
      return part && part.asOf && panelIso && part.asOf < panelIso ? ' · ' + self.asOf(part.asOf) : '';
    };
    var marchesAsOf = newestPart(L.marches, L.asOf);
    var barricadesAsOf = newestPart(L.barricades, L.asOf);
    var snapshot = meta.snapshotAsOf || null;
    var staleDays = meta.staleAfterDays != null ? meta.staleAfterDays : 7;

    /* ---------- Theme ---------- */
    var themes = ['auto', 'light', 'dark'];
    var themeNames = { auto: 'Auto', light: 'Light', dark: 'Dark' };
    var cycleTheme = function () { self.setState({ theme: themes[(themes.indexOf(S.theme) + 1) % themes.length] }); };

    /* ---------- Level cap from the (Unverified) community rule table ---------- */
    var tc = tcObj.level != null ? tcObj.level : null;
    var capTable = rules.heroLevelCapByTC || {};
    var cap = (tc != null && capTable[String(tc)] != null) ? capTable[String(tc)] : null;

    var byName = {};
    heroes.forEach(function (h) { if (h && h.name) byName[h.name] = h; });

    // "New" = not in the previous snapshot's hero list. No previous list → nobody is new.
    var prevList = (meta.previousSnapshot && Array.isArray(meta.previousSnapshot.heroes)) ? meta.previousSnapshot.heroes : [];
    var isNew = function (n) { return prevList.length > 0 && prevList.indexOf(n) < 0; };

    /* ---------- Assignments: derived from lineups, never stored per hero ---------- */
    var assign = {};
    var addA = function (n, label, kind) { if (!n) return; (assign[n] = assign[n] || []).push({ label: label, kind: kind }); };
    (L.marches || []).forEach(function (m) {
      (m.heroes || []).forEach(function (x) { addA(x.hero, 'March ' + m.name + (x.lead ? ' · lead' : ''), 'march'); });
    });
    var arena = L.arena || {};
    [['attack', 'Arena attack'], ['defense', 'Arena defense']].forEach(function (p) {
      var t = arena[p[0]]; if (!t) return;
      (t.front || []).forEach(function (n) { addA(n, p[1] + ' · front', 'arena'); });
      (t.back || []).forEach(function (n) { addA(n, p[1] + ' · back', 'arena'); });
    });
    (L.barricades || []).forEach(function (b) { (b.heroes || []).forEach(function (n) { addA(n, b.name, 'barricade'); }); });
    if (L.guardStation && Array.isArray(L.guardStation.heroes)) L.guardStation.heroes.forEach(function (n) { addA(n, 'Guard Station', 'guard'); });
    if (DC) {
      (DC.instructors || []).forEach(function (i) { addA(i.hero, 'Drill instructor', 'drill'); });
      (DC.slotted || []).forEach(function (n) { addA(n, 'Drill slot', 'drill'); });
    }
    var inLineup = function (n) { return (assign[n] || []).some(function (a) { return a.kind !== 'drill'; }); };

    var openHero = function (n) { return function () { self.setState({ hero: n }); }; };

    /* ---------- Hero view-models ---------- */
    // 'progress' means the shared book stock was below the cost when read (rules.skillBooks), not saved progress.
    var ST = { capped: 'Capped', upgradeable: 'Upgradeable now', progress: 'Needs books', locked: 'Locked until next star' };
    var heroVM = function (h) {
      var lvl = h.level != null ? h.level : null;
      var levelText = lvl == null ? NR : (cap != null ? lvl + ' / ' + cap : lvl + ' / cap not recorded');
      var levelPct = (lvl != null && cap) ? Math.min(100, Math.round(lvl / cap * 100)) : 0;
      var parts = [];
      if (h.stars != null) parts.push(h.stars + '★');
      if (h.tier != null) parts.push('T' + h.tier);
      var sh = h.shards || null;
      var shardOk = sh && sh.have != null && sh.need;
      var shardText = shardOk ? sh.have + '/' + sh.need + ' to ' + (sh.to || 'next step') : NR;
      var shardPct = shardOk ? Math.min(100, Math.round(sh.have / sh.need * 100)) : 0;
      var slots = (h.gear && Array.isArray(h.gear.slots)) ? h.gear.slots : null;
      var bad = slots ? slots.filter(function (s) { return s.state === 'empty' || s.state === 'plus0'; }) : [];
      // Skill summary: "4 capped · 2 in progress", "All capped", or Not recorded.
      var skillText = 'Skills: ' + NR;
      if (Array.isArray(h.skills) && h.skills.length) {
        var counts = {}; var allParts = [];
        h.skills.forEach(function (k) {
          if (k.all) allParts.push('All ' + (ST[k.status] || k.status || NR).toLowerCase());
          else counts[k.status] = (counts[k.status] || 0) + (k.count || 1);
        });
        var cp = ['capped', 'upgradeable', 'progress', 'locked'].filter(function (k) { return counts[k]; })
          .map(function (k) { return counts[k] + ' ' + ST[k].toLowerCase(); });
        skillText = 'Skills: ' + allParts.concat(cp).join(' · ');
      }
      var rar = h.rarity || NR;
      return {
        key: h.name, name: h.name || NR, isNew: isNew(h.name),
        rarity: rar, rarCls: 'rar-' + String(rar).toLowerCase().replace(/[^a-z]/g, ''),
        cls: h.cls || 'Class: ' + NR,
        genText: h.generation != null ? 'Gen ' + h.generation : 'Gen: ' + NR,
        roleText: h.role || NR,
        starsText: parts.length ? parts.join(' ') : 'Stars: ' + NR,
        levelText: levelText, levelPct: levelPct, lvl: lvl,
        shardText: shardText, shardPct: shardPct, shardRatio: shardOk ? sh.have / sh.need : -1,
        power: h.power != null ? h.power : null, powerText: self.num(h.power),
        gearPower: h.gearPower != null ? h.gearPower : null, gearText: self.num(h.gearPower),
        skillText: skillText,
        hasFlag: bad.length > 0,
        flagText: 'Gear: ' + bad.map(function (s) { return s.slot + (s.state === 'empty' ? ' empty' : ' +0'); }).join(', '),
        assign: (assign[h.name] || []).map(function (a) { return { label: a.label }; }),
        noAssign: !(assign[h.name] || []).length,
        open: openHero(h.name)
      };
    };
    var allVM = heroes.filter(function (h) { return h && h.name; }).map(heroVM);

    /* ---------- Hero filters (options derived from data, incl. "Not recorded") ---------- */
    var distinct = function (key) {
      var vals = []; var hasNull = false;
      heroes.forEach(function (h) { var v = h[key]; if (v === null || v === undefined || v === '') hasNull = true; else if (vals.indexOf(v) < 0) vals.push(v); });
      if (hasNull) vals.push('__none');
      return vals;
    };
    var fdefs = [
      { key: 'cls', st: 'fCls', label: 'Class' },
      { key: 'rarity', st: 'fRar', label: 'Rarity' },
      { key: 'generation', st: 'fGen', label: 'Gen' },
      { key: 'role', st: 'fRole', label: 'Role' }
    ];
    var chip = function (stKey, value, label) {
      var on = S[stKey] === value;
      var patch = {}; patch[stKey] = value;
      return { label: label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', pick: function () { self.setState(patch); } };
    };
    var filterGroups = fdefs.map(function (fd) {
      return { label: fd.label, chips: ['all'].concat(distinct(fd.key)).map(function (v) {
        var lbl = v === 'all' ? 'All' : (v === '__none' ? NR : (fd.key === 'generation' ? 'Gen ' + v : String(v)));
        return chip(fd.st, v, lbl);
      }) };
    });
    filterGroups.push({ label: 'Sort', chips: [['power', 'Power'], ['level', 'Level'], ['gear', 'Gear power'], ['shards', 'Shard progress'], ['name', 'Name']].map(function (p) { return chip('sort', p[0], p[1]); }) });
    var match = function (h, key, sel) {
      if (sel === 'all') return true;
      if (sel === '__none') return h[key] === null || h[key] === undefined || h[key] === '';
      return h[key] === sel;
    };
    var desc = function (a, b) { return (b == null ? -Infinity : b) - (a == null ? -Infinity : a); };
    var sorters = {
      power: function (a, b) { return desc(a.power, b.power); },
      level: function (a, b) { return desc(a.lvl, b.lvl) || desc(a.power, b.power); },
      gear: function (a, b) { return desc(a.gearPower, b.gearPower); },
      shards: function (a, b) { return b.shardRatio - a.shardRatio; },
      name: function (a, b) { return String(a.name).localeCompare(String(b.name)); }
    };
    var heroList = heroes.filter(function (h) {
      return h && h.name && match(h, 'cls', S.fCls) && match(h, 'rarity', S.fRar) && match(h, 'generation', S.fGen) && match(h, 'role', S.fRole);
    }).map(function (h) { return allVM.filter(function (x) { return x.key === h.name; })[0]; })
      .sort(sorters[S.sort] || sorters.power);
    var heroAsOfs = heroes.map(function (h) { return h.asOf; }).filter(Boolean).sort();
    var heroOldest = heroAsOfs.length ? heroAsOfs[0] : null;
    var sortName = { power: 'power', level: 'level', gear: 'gear power', shards: 'shard progress', name: 'name' }[S.sort];
    var gen2 = rules.gen2Heroes && rules.gen2Heroes.serverDay;
    var heroMeta = {
      countText: 'Showing ' + heroList.length + ' of ' + allVM.length + ' heroes · sorted by ' + sortName + ' · ' + self.asOf(heroOldest),
      empty: heroList.length === 0,
      capNote: cap != null ? 'Level cap ' + cap + ' at Town Center ' + tc + ' (community rule, Unverified).' : 'Level cap at Town Center ' + (tc != null ? tc : NR) + ': Not recorded.',
      lockedNote: (meta.lockedHeroesNotInData ? meta.lockedHeroesNotInData + ' locked heroes are not in the data. ' : '') + (gen2 ? 'Gen 2 heroes arrive on server day ' + gen2 + ' (Unverified); server day: ' + (gov.serverDay != null ? gov.serverDay : NR) + '.' : '')
    };

    /* ---------- Hero drawer ---------- */
    var dh0 = S.hero ? byName[S.hero] : null;
    var drawer = { open: false, name: '', rarity: '', rarCls: '', cls: '', genText: '', isNew: false, asOf: '', levelText: '', starsText: '', shardText: '', powerText: '', gearText: '', roleText: '', slots: [], slotsNote: '', hasGearNote: false, gearNote: '', widgetText: '', skills: [], noSkills: false, assign: [], noAssign: false, hasNotes: false, notes: [] };
    if (dh0) {
      var vm = allVM.filter(function (x) { return x.key === dh0.name; })[0];
      var slots = (dh0.gear && Array.isArray(dh0.gear.slots)) ? dh0.gear.slots : null;
      var w = dh0.widget;
      drawer = {
        open: true, name: vm.name, rarity: vm.rarity, rarCls: vm.rarCls, cls: vm.cls, genText: vm.genText, isNew: vm.isNew,
        asOf: self.asOf(dh0.asOf), levelText: vm.levelText + (cap != null ? ' (cap per TC ' + tc + ', Unverified)' : ''),
        starsText: vm.starsText, shardText: vm.shardText, powerText: vm.powerText, gearText: vm.gearText, roleText: vm.roleText,
        slots: (slots || []).map(function (s) {
          var badS = s.state === 'empty' || s.state === 'plus0';
          var txt = s.state === 'empty' ? 'Empty' : (s.state === 'plus0' ? '+0' : (s.state || NR));
          return { slot: (s.quality ? s.quality + ' ' : '') + (s.slot || 'Slot'), stateText: txt, cls: badS ? 'bad' : '' };
        }),
        // gear.slotsComplete (set by scripts/build_data.py) means the list is every slot, not just the problem ones.
        slotsNote: slots === null ? 'Slot-by-slot gear: Not recorded.' : (dh0.gear.slotsComplete === true ? 'All slots recorded.' : 'Other slots: Not recorded.'),
        hasGearNote: !!(dh0.gear && dh0.gear.note), gearNote: (dh0.gear && dh0.gear.note) || '',
        // Explains that skill book counts are a shared stock (data/manual.json → rules.skillBooks).
        hasBookRule: !!(rules.skillBooks && rules.skillBooks.text),
        bookRule: rules.skillBooks ? rules.skillBooks.text + ' (' + (rules.skillBooks.source || 'Source not recorded') + ', ' + (rules.skillBooks.confidence || 'Unverified') + '.)' : '',
        widgetText: !w ? NR : (w.unlocked ? 'Unlocked' + (w.name ? ' · ' + w.name : '') + ' · ' + (w.level != null ? '+' + w.level : 'level ' + NR) : 'Locked'),
        skills: (Array.isArray(dh0.skills) ? dh0.skills : []).map(function (k) {
          var name = k.name + (k.level != null ? ' · Lv ' + k.level : '');
          var note = [k.effect, k.note, k.needs ? 'Needs ' + k.needs : null].filter(Boolean).join(' · ');
          return { name: name, statusText: ST[k.status] || NR, stCls: 'st-' + (k.status || 'locked'), note: note || ' ',
                   hasConf: !!k.confidence, conf: k.confidence || '', confCls: 'conf conf-' + String(k.confidence || '').toLowerCase() };
        }),
        noSkills: !Array.isArray(dh0.skills) || !dh0.skills.length,
        assign: vm.assign, noAssign: vm.noAssign,
        hasNotes: Array.isArray(dh0.notes) && dh0.notes.length > 0,
        notes: (dh0.notes || []).map(function (t) { return { text: t }; })
      };
    }
    var closeHero = function () { self.setState({ hero: null }); };

    /* ---------- Drill Camp: lowest instructor, slots, placement plan ---------- */
    var dc = { has: false, missing: true, lede: 'Drill Camp data: Not recorded.', instructors: [], slots: [], plan: [] };
    if (DC) {
      var ins = DC.instructors || [];
      var lv = ins.map(function (i) { return i.level; }).filter(function (x) { return x != null; });
      var minLvl = lv.length ? Math.min.apply(null, lv) : null;
      var lowest = ins.filter(function (i) { return i.level === minLvl; });
      var insVM = ins.map(function (i) {
        var now = byName[i.hero] ? byName[i.hero].level : null;
        var mm = now != null && i.level != null && now !== i.level;
        return { name: i.hero || NR, levelText: i.level != null ? 'Lv ' + i.level : NR, isLowest: minLvl != null && i.level === minLvl,
                 cls: (minLvl != null && i.level === minLvl) ? 'lowest' : '', mismatch: mm,
                 mismatchText: mm ? 'Hero data now: Lv ' + now : '' };
      });
      var lowestText = minLvl == null ? 'Instructor levels: Not recorded.'
        : (lowest.length === ins.length ? 'All ' + ins.length + ' instructors are tied at Lv ' + minLvl + '. Every slotted hero runs at Lv ' + minLvl + '.'
          : 'Lowest: ' + lowest.map(function (i) { return i.hero; }).join(', ') + ' at Lv ' + minLvl + '. Every slotted hero runs at this level.');
      var total = DC.slotsTotal != null ? DC.slotsTotal : 0;
      var filled = DC.slotted || [];
      var openN = DC.slotsOpen != null ? DC.slotsOpen : 0;
      var openEmpty = Math.max(0, openN - filled.length);
      var insSet = ins.map(function (i) { return i.hero; });
      // Candidates = heroes that are not instructors and not already slotted.
      var cands = heroes.filter(function (h) { return h.name && insSet.indexOf(h.name) < 0 && filled.indexOf(h.name) < 0; });
      var above = cands.filter(function (h) { return minLvl != null && h.level != null && h.level > minLvl; });
      var unknownLv = cands.filter(function (h) { return h.level == null; });
      var eligible = cands.filter(function (h) { return minLvl != null && h.level != null && h.level <= minLvl; });
      // Rank: biggest free level gain first, then heroes outside lineups, then the test hero, then lowest power.
      eligible.sort(function (a, b) {
        var g = (b.level - a.level) * -1; if (g) return g;
        var la = inLineup(a.name) ? 1 : 0, lb = inLineup(b.name) ? 1 : 0; if (la !== lb) return la - lb;
        if (a.name === DC.testHero) return -1; if (b.name === DC.testHero) return 1;
        return (a.power || 0) - (b.power || 0);
      });
      var placed = eligible.slice(0, openEmpty);
      var overflow = eligible.slice(openEmpty);
      var locked = DC.lockedSlots || [];
      var cells = [];
      for (var i = 1; i <= total; i++) {
        if (i <= filled.length) cells.push({ n: i, state: 'Filled', detail: filled[i - 1], cls: 'filled' });
        else if (i <= openN) {
          var p = placed[i - filled.length - 1];
          cells.push({ n: i, state: 'Open · empty', detail: p ? 'Plan: ' + p.name : 'No candidate', cls: 'open' });
        } else {
          var lk = locked.filter(function (x) { return x.slot === i; })[0];
          var req = lk && lk.requirement ? lk.requirement : 'Requirement not recorded';
          var dist = (lk && lk.tcLevel != null && tc != null) ? (lk.tcLevel - tc > 0 ? ' · ' + (lk.tcLevel - tc) + (lk.tcLevel - tc === 1 ? ' level away' : ' levels away') : ' · should be open now') : '';
          cells.push({ n: i, state: 'Locked', detail: req + dist, cls: 'locked' });
        }
      }
      dc = {
        has: true, missing: false,
        lede: 'Reading from ' + self.date(DC.asOf) + ' (' + self.ageText(DC.asOf) + ')' + (snapshot && DC.asOf && DC.asOf < snapshot ? ', older than the hero data.' : '.'),
        asOf: self.asOf(DC.asOf),
        instructors: insVM, lowestText: lowestText,
        slots: cells,
        slotSummary: openN + ' open · ' + filled.length + ' filled · ' + Math.max(0, total - openN) + ' locked · ' + total + ' total',
        planLead: openEmpty + ' slots empty and ' + cands.length + ' non-instructor heroes. Place these heroes:',
        plan: placed.map(function (h) {

        label: (r === true ? 'Mark ' + code + ' as not redeemed' : 'Mark ' + code + ' as redeemed'),
        toggle: c.code ? toggleCode(c.code) : null
      };
    };
    var pendingCodes = Object.keys(marks).filter(function (k) { return Object.prototype.hasOwnProperty.call(codeBase, k); });
    var activeRows = codesD ? (codesD.active || []).map(codeRow) : [];
    var toRedeem = activeRows.filter(function (r) { return r.pressed !== 'true'; }).length;
    var codes = codesD ? {
      asOf: self.asOf(codesD.asOf),
      lede: activeRows.length + ' active (' + toRedeem + ' to redeem) · ' + (codesD.expiredTotal != null ? codesD.expiredTotal : (codesD.expired || []).length) + ' expired',
      active: activeRows, noActive: !activeRows.length,
      expired: (codesD.expired || []).map(codeRow),
      expiredCount: (codesD.expiredTotal != null ? codesD.expiredTotal : (codesD.expired || []).length) + ' total',
      unlistedText: codesD.expiredTotal != null && codesD.expiredTotal > (codesD.expired || []).length ? (codesD.expiredTotal - (codesD.expired || []).length) + ' more expired codes are not listed by name.' : '',
      hasPending: pendingCodes.length > 0,
      pendingText: pendingCodes.length + (pendingCodes.length === 1 ? ' mark is' : ' marks are') + ' not in codes.md yet: ' +
        pendingCodes.map(function (k) { return k + ' → ' + stateText(marks[k]); }).join(', ') + '.',
      clearMarks: function () { self.setState({ codeMarks: {} }); }
    } : { asOf: self.asOf(null), lede: 'Gift codes: Not recorded.', active: [], noActive: true, expired: [], expiredCount: NR, unlistedText: '', hasPending: false, pendingText: '', clearMarks: null };

    /* ---------- Overview ---------- */
    var tile = function (label, value, asOfIso, note) {
      return { label: label, value: value, vCls: value === NR ? 'nr' : '', asOf: self.asOf(asOfIso), hasNote: !!note, note: note || '' };
    };
    var gems = res.gems && res.gems.value != null ? res.gems.value : null;
    var tiles = [
      // governor.powerRounded: the game showed a rounded figure (11.4M); don't print false precision.
      tile('Account power', gov.powerRounded === true ? self.compact(gov.power) : self.num(gov.power), gov.asOf),
      // Total kills from the Governor Profile; also listed under Governor on the City view.
      tile('Total kills', self.num(gov.kills), gov.asOf),
      tile('Town Center', tc != null ? 'Lv ' + tc : NR, tcObj.asOf),
      tile('Total troops', self.num(army.total), armyAsOf('total')),
      tile('March capacity', self.num(army.marchCapacity), armyAsOf('marchCapacity')),
      tile('March queues', q.current != null ? q.current + '/' + (q.max != null ? q.max : '?') : NR, armyAsOf('queues')),
      tile('Infirmary', self.num(army.infirmary), armyAsOf('infirmary')),
      tile('VIP', gov.vip != null ? String(gov.vip) : NR, gov.asOf),
      tile('Gems', self.num(gems), res.asOf),
      tile('Stamina', st.current != null ? st.current + '/' + (st.max != null ? st.max : '?') : NR, gov.asOf, (st.current != null && st.max != null && st.current > st.max) ? 'Above max' : '')
    ];
    var go = function (view) { return function () { self.setState({ view: view }); }; };
    var belowCap = cap != null ? heroes.filter(function (h) { return h.level != null && h.level < cap; }).length : null;
    var emptySlots = 0, plus0 = 0;
    heroes.forEach(function (h) { ((h.gear && h.gear.slots) || []).forEach(function (s) { if (s.state === 'empty') emptySlots++; if (s.state === 'plus0') plus0++; }); });
    var watch = [
      { label: belowCap != null ? 'Heroes below the Lv ' + cap + ' cap' : 'Heroes below level cap', value: belowCap != null ? belowCap + ' of ' + heroes.length : NR, cls: belowCap ? 'warn' : '', go: go('heroes') },
      { label: 'Empty gear slots / pieces at +0', value: emptySlots + ' / ' + plus0, cls: (emptySlots || plus0) ? 'warn' : '', go: go('invest') },
      { label: 'Empty Drill Camp slots', value: DC ? String(Math.max(0, (DC.slotsOpen || 0) - (DC.slotted || []).length)) : NR, cls: DC && (DC.slotsOpen || 0) > (DC.slotted || []).length ? 'warn' : '', go: go('drill') },
      { label: 'Heroes in more than one march', value: String(marchConflicts.length), cls: marchConflicts.length ? 'warn' : '', go: go('army') },
      { label: 'Data conflicts to resolve', value: String(conflicts.length), cls: conflicts.length ? 'warn' : '', go: go('health') }
    ];

    /* ---------- Navigation ---------- */
    var views = [
      ['overview', 'Overview', null], ['heroes', 'Heroes', String(allVM.length)], ['drill', 'Drill Camp', null],
      ['army', 'Army & marches', marchConflicts.length ? '!' : null], ['defense', 'Defense & Arena', null], ['city', 'City', null],
      ['invest', 'Invest', String(recs.length)], ['features', 'Features', null],
      ['health', 'Data health', String(conflicts.length + missing.length + stale.length)], ['codes', 'Codes', null]
    ];
    var vflags = {}; views.forEach(function (x) { vflags[x[0]] = S.view === x[0]; });
    var nav = views.map(function (x) {
      var on = S.view === x[0];
      return { label: x[1], cls: on ? 'on' : '', current: on ? 'page' : 'false', go: function () { self.setState({ view: x[0], hero: null }); },
               hasBadge: x[2] != null, badge: x[2] || '', badgeCls: (x[0] === 'health' || x[0] === 'army') ? 'warn' : '' };
    });

    return {
      themeClass: S.theme, themeName: themeNames[S.theme], cycleTheme: cycleTheme,
      gov: { name: gov.name || 'Governor: ' + NR,
             line: [gov.kingdom != null ? 'Kingdom #' + gov.kingdom : 'Kingdom: ' + NR, gov.alliance ? 'Alliance ' + gov.alliance : 'Alliance: ' + NR, gov.vip != null ? 'VIP ' + gov.vip : null].filter(Boolean).join(' · ') },
      age: { snapshot: snapshot ? self.date(snapshot) : NR,
             sub: self.ageText(snapshot) + (oldest && oldest.asOf !== snapshot ? ' · oldest: ' + oldest.label + ', ' + self.date(oldest.asOf, true) + ' (' + self.ageText(oldest.asOf) + ')' : ''),
             subCls: anyStale ? 'warn' : '', staleDays: staleDays },
      nav: nav, v: vflags,
      tiles: tiles, moves: moves, movesEmpty: moves.length === 0, watch: watch, ageRows: ageRows,
      filterGroups: filterGroups, heroList: heroList, heroMeta: heroMeta,
      drawer: drawer, closeHero: closeHero,
      dc: dc, army: armyVM,
      teams: teams, barricades: barricades, noBarricades: barricades.length === 0, defAsOf: self.asOf(barricadesAsOf), guard: guard,
      city: city, invest: invest, features: features, featMeta: featMeta, health: health, codes: codes
    };
  }
}

/* =====================================================================
 * Rendering helpers.
 * Why: every data value passes through esc() before reaching innerHTML,
 * because KS_DATA is generated from user-edited Markdown files.
 * ===================================================================== */

/** @type {Function[]} Click handlers registered during the current render. */
var handlers = [];
/** @type {?string} Focus key to restore after the next render. */
var pendingFocus = null;
/** @type {?string} Focus key of the control that opened the hero drawer. */
var drawerOpener = null;
/** @type {?string} Focus key of the control clicked most recently. */
var lastClickKey = null;

/**
 * HTML-escape any value for safe use in text and attributes.
 * @param {*} v Value to escape; null/undefined become an empty string.
 * @returns {string}
 */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/**
 * Map a list to HTML and join it. Tolerates null/undefined lists.
 * @param {?Array} list
 * @param {function(*, number): string} fn
 * @returns {string}
 */
function each(list, fn) {
  return (Array.isArray(list) ? list : []).map(fn).join('');
}

/**
 * Return `html` when `cond` is truthy, else an empty string.
 * @param {*} cond
 * @param {string} html
 * @returns {string}
 */
function when(cond, html) {
  return cond ? html : '';
}

/**
 * Register a click handler and return the attributes that bind it.
 * The stable `data-fk` key lets focus survive a full re-render.
 * @param {Function} fn Handler to call on click.
 * @param {string} key Stable focus key, unique within the page.
 * @returns {string} Attribute string, starting with a space.
 */
function on(fn, key) {
  handlers.push(fn);
  return ' data-h="' + (handlers.length - 1) + '" data-fk="' + esc(key) + '"';
}

/**
 * Clamp a percentage for inline width styles.
 * @param {*} n
 * @returns {number} 0–100
 */
function pct(n) {
  var x = Number(n);
  return isNaN(x) ? 0 : Math.max(0, Math.min(100, x));
}

/** Inline icons (decorative, hidden from screen readers). */
var ICON_THEME = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v16"></path><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg>';
var ICON_WARN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18h.01"></path></svg>';
var ICON_CLOSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>';

/**
 * Render a list of confidence badges.
 * @param {Array<{label:string, cls:string}>} confs
 * @returns {string}
 */
function tplConfs(confs) {
  return each(confs, function (c) { return '<span class="' + esc(c.cls) + '">' + esc(c.label) + '</span>'; });
}

/**
 * Render a stacked class bar plus its legend rows.
 * @param {Array<object>} split Segments from renderVals (name, segCls, w, countText, pctText).
 * @param {string} aria Accessible description of the whole bar.
 * @param {boolean} tight Remove the legend's top margin (inside march cards).
 * @returns {string}
 */
function tplSplit(split, aria, tight) {
  return '<div class="stack" role="img" aria-label="' + esc(aria) + '">' +
    each(split, function (s) { return '<span class="seg ' + esc(s.segCls) + '" style="width:' + pct(s.w) + '%"></span>'; }) +
    '</div><div class="legend"' + (tight ? ' style="margin-top:0"' : '') + '>' +
    each(split, function (s) {
      return '<span class="sw ' + esc(s.segCls) + '" aria-hidden="true"></span><span>' + esc(s.name) + '</span>' +
        '<span class="num">' + esc(s.countText) + '</span><span class="num">' + esc(s.pctText) + '</span>';
    }) + '</div>';
}

/**
 * Render a row of filter chips.
 * @param {string} label Group label.
 * @param {Array<object>} chips Chips from renderVals (label, cls, pressed, pick).
 * @param {string} keyPrefix Focus-key prefix for this group.
 * @returns {string}
 */
function tplChipGroup(label, chips, keyPrefix) {
  return '<div class="fgroup" role="group" aria-label="' + esc(label) + '"><span class="flabel">' + esc(label) + '</span>' +
    each(chips, function (c) {
      return '<button class="chip ' + esc(c.cls) + '" aria-pressed="' + esc(c.pressed) + '"' + on(c.pick, keyPrefix + ':' + c.label) + '>' + esc(c.label) + '</button>';
    }) + '</div>';
}

/* =====================================================================
 * View templates — one function per view, mirroring the approved
 * prototype's markup and class names one-to-one.

/**
 * Header with governor identity, data age and theme toggle.

function tplHeader(v) {
  return '<header class="top"><div class="top-in">' +
    '<div class="who"><span class="eyebrow">' + esc(v.gov.line) + '</span><h1>' + esc(v.gov.name) + '</h1></div>' +
    '<div class="age"><span class="age-main">Data as of ' + esc(v.age.snapshot) + '</span>' +
    '<span class="age-sub ' + esc(v.age.subCls) + '">' + esc(v.age.sub) + '</span></div>' +
    '<button class="theme-btn"' + on(v.cycleTheme, 'theme') + ' aria-label="Change colour theme, current: ' + esc(v.themeName) + '">' +
    ICON_THEME + '<span>' + esc(v.themeName) + '</span></button>' +
    '</div></header>';
}

/**
 * View navigation: side menu on desktop, scrolling tab strip on phone.
 * @param {object} v
 * @returns {string}
 */
function tplNav(v) {
  return '<nav class="nav" aria-label="Dashboard views">' + each(v.nav, function (n) {
    return '<button class="nav-btn ' + esc(n.cls) + '"' + (n.current === 'page' ? ' aria-current="page"' : '') + on(n.go, 'nav:' + n.label) + '>' +

}

/**
 * View 1 — Overview: tiles, top 5 moves, weak spots, data age.
 * @param {object} v

 */
function tplOverview(v) {
  return '<div class="view">' +
    '<div class="view-h"><h2>Overview</h2><p class="lede">Where you stand, where you\'re weak, and where the next resources should go.</p></div>' +
    '<div class="tiles">' + each(v.tiles, function (t) {
      return '<div class="tile"><span class="tile-l">' + esc(t.label) + '</span><span class="tile-v ' + esc(t.vCls) + '">' + esc(t.value) + '</span>' +
        when(t.hasNote, '<span class="tile-note">' + esc(t.note) + '</span>') +
        '<span class="tile-s">' + esc(t.asOf) + '</span></div>';
    }) + '</div>' +
    '<div class="grid2">' +
    '<section class="panel"><div class="panel-h"><h3>Top 5 moves now</h3><span class="asof">Ranked from Invest</span></div>' +
    '<ol class="moves">' + each(v.moves, function (m) {
      return '<li><button class="move"' + on(m.go, 'move:' + m.n) + '><span class="move-n">' + esc(m.n) + '</span>' +
        '<span class="move-b"><span class="move-t">' + esc(m.what) + '</span>' +
        each(m.changes, function (c) {
          // Final state only; grouped changes read "Front a, b · Back c, d".
          return '<span class="move-c">' + esc(c.where) + ': ' +
            each(c.rows, function (r, j) {
              return (j ? ' · ' : '') + (r.label ? esc(r.label) + ' ' : '') +

            }) + '</span>';
        }) +
        '<span class="move-m">' + tplConfs(m.confs) + '<span>Cost: ' + esc(m.cost) + '</span></span></span></button></li>';
    }) + '</ol>' +
    when(v.movesEmpty, '<p class="empty">No recommendations recorded.</p>') +
    '</section>' +
    '<div class="col">' +
    '<section class="panel"><div class="panel-h"><h3>Weak spots</h3><span class="asof">Counted from the data</span></div><div class="rows">' +
    each(v.watch, function (w) {
      return '<button class="row-btn"' + on(w.go, 'watch:' + w.label) + '><span class="row-k">' + esc(w.label) + '</span><span class="row-v ' + esc(w.cls) + '">' + esc(w.value) + '</span></button>';
    }) + '</div></section>' +
    '<section class="panel"><div class="panel-h"><h3>Data age</h3><span class="asof">Stale after ' + esc(v.age.staleDays) + ' days</span></div>' +
    '<div class="agetbl"><span class="h">Area</span><span class="h">As of</span><span class="h">Age</span>' +
    each(v.ageRows, function (r) { return '<span>' + esc(r.label) + '</span><span>' + esc(r.date) + '</span><span class="' + esc(r.cls) + '">' + esc(r.age) + '</span>'; }) +
    '</div></section>' +
    '</div></div></div>';
}

}

/**
 * One power check block (stated vs. sum of hero powers).
 * @param {object} c Object with statedText, sumText, diffText, diffCls.
 * @param {boolean} tight Remove the top margin.
 * @returns {string}
 */
function tplCheck(c, tight) {
  return '<div class="check"' + (tight ? ' style="margin-top:0"' : '') + '>' +
    '<span>Stated power</span><span class="num">' + esc(c.statedText) + '</span>' +
    '<span>Sum of current hero powers</span><span class="num">' + esc(c.sumText) + '</span>' +
    '<span>Difference</span><span class="num ' + esc(c.diffCls) + '">' + esc(c.diffText) + '</span></div>';
}

/**
 * View 5 — Defense & Arena: 2-front / 3-back grids, barricades, guard station.
 * @param {object} v
 * @returns {string}
 */
function tplDefense(v) {
  var slot = function (team) {
    return function (f) {
      return '<button class="fslot"' + on(f.open, 'slot:' + team + ':' + f.name) + '><span class="fslot-n">' + esc(f.name) + '</span><span class="fslot-p">' + esc(f.sub) + '</span></button>';
    };
  };
  return '<div class="view">' +
    '<div class="view-h"><h2>Defense &amp; Arena</h2><p class="lede">Lineups as recorded, checked against today\'s hero powers.</p></div>' +
    '<div class="grid2">' + each(v.teams, function (t) {
      return '<section class="panel"><div class="panel-h"><h3>' + esc(t.name) + '</h3><span class="asof">' + esc(t.asOf) + '</span></div>' +
        '<div class="form"><span class="form-lbl">Front</span><div class="form-row ' + esc(t.frontCls) + '">' + each(t.front, slot(t.key + 'f')) + '</div>' +
        '<span class="form-lbl">Back</span><div class="form-row ' + esc(t.backCls) + '">' + each(t.back, slot(t.key + 'b')) + '</div></div>' +
        tplCheck(t, false) +
        when(t.hasNote, '<p class="foot" style="margin-top:8px">' + esc(t.note) + '</p>') +
        '</section>';
    }) + '</div>' +
    '<section class="panel"><div class="panel-h"><h3>Barricades</h3><span class="asof">' + esc(v.defAsOf) + '</span></div>' +
    '<div class="grid2">' + each(v.barricades, function (b) {
      return '<div class="march"><div class="march-h"><h4>' + esc(b.name) + '</h4><span class="mini">' + esc(b.levelText) + '</span></div>' +
        '<div class="chips-s">' + each(b.heroes, function (h) { return '<span class="chip-s">' + esc(h.label) + '</span>'; }) + '</div>' +
        tplCheck(b, true) + '</div>';
    }) + '</div>' +
    when(v.noBarricades, '<p class="empty">Barricades: Not recorded.</p>') + '</section>' +
    '<section class="panel"><div class="panel-h"><h3>Guard Station</h3><span class="asof">' + esc(v.guard.asOf) + '</span></div>' +
    '<p class="' + esc(v.guard.cls) + '" style="margin:0">' + esc(v.guard.text) + '</p></section>' +
    '</div>';
}

/**
 * Definition-list rows.
 * @param {Array<{k:string, v:string, cls:?string}>} rows
 * @returns {string}
 */
function tplKv(rows) {
  return '<dl class="kv">' + each(rows, function (r) { return '<dt>' + esc(r.k) + '</dt><dd class="' + esc(r.cls || '') + '">' + esc(r.v) + '</dd>'; }) + '</dl>';
}

/**
 * View 6 — City: Town Center, resources, Governor Gear, governor stats.
 * @param {object} v
 * @returns {string}
 */
function tplCity(v) {
  var c = v.city;
  return '<div class="view">' +
    '<div class="view-h"><h2>City</h2><p class="lede">Town Center, stores and Governor Gear.</p></div>' +
    '<div class="grid2">' +
    '<section class="panel"><div class="panel-h"><h3>Town Center</h3><span class="asof">' + esc(c.asOf) + '</span></div>' + tplKv(c.tc) +
    '<div class="meter" style="margin-top:14px"><span class="meter-l"><span>Perks unlocked</span><b>' + esc(c.perkText) + '</b></span>' +
    '<span class="bar" aria-hidden="true"><span class="bar-f" style="width:' + pct(c.perkPct) + '%"></span></span></div>' +
    when(c.perkNote, '<p class="foot" style="margin-top:8px">' + esc(c.perkNote) + '</p>') + '</section>' +
    '<div class="col">' +
    '<section class="panel"><div class="panel-h"><h3>Stored resources</h3><span class="asof">' + esc(c.resAsOf) + '</span></div>' + tplKv(c.res) + '</section>' +
    '<section class="panel"><div class="panel-h"><h3>Governor Gear</h3><span class="asof">' + esc(c.ggAsOf) + '</span></div>' +
    '<p style="margin:0;font-weight:600">' + esc(c.ggText) + '</p><p class="foot" style="margin-top:6px">' + esc(c.ggUnlock) + '</p></section>' +
    '<section class="panel"><div class="panel-h"><h3>Governor</h3><span class="asof">' + esc(c.govAsOf) + '</span></div>' + tplKv(c.gov) + '</section>' +
    '</div></div></div>';
}

/**
 * Render a comma-separated token list for a now/suggested row.
 * @param {Array<{text:string, cls:string}>} toks Tokens with their CSS class (struck out / highlighted).
 * @param {boolean} empty True when the "now" side was empty slots.
 * @returns {string}
 */
function tplToks(toks, empty) {
  if (empty) return '<span class="tok tok-out">Empty</span>';
  return each(toks, function (t, k) { return '<span class="' + esc(t.cls) + '">' + esc(t.text) + (k < toks.length - 1 ? ',' : '') + '</span> '; });
}

/**
 * View 7 — Invest: grouped, filterable recommendations.
 * @param {object} v
 * @returns {string}
 */
function tplInvest(v) {
  var iv = v.invest;
  return '<div class="view">' +
    '<div class="view-h"><h2>Invest</h2><p class="lede">Every move with what to do, why, cost and how sure we are.</p></div>' +
    '<section class="panel"><div class="fbar">' + tplChipGroup('Type', iv.typeChips, 'itype') + tplChipGroup('Hero', iv.heroChips, 'ihero') + '</div></section>' +
    each(iv.groups, function (g) {
      return '<div class="grp"><div class="grp-h"><h3>' + esc(g.type) + '</h3><span class="mini">' + esc(g.countText) + '</span></div>' +
        each(g.recs, function (r) {
          return '<section class="panel rec">' +
            '<div class="item-h"><span class="rec-what">' + esc(r.rank) + '. ' + esc(r.what) + '</span><span class="move-m">' + tplConfs(r.confs) + '</span></div>' +
            '<dl class="kv"><dt>Why</dt><dd>' + esc(r.why) + '</dd><dt>Cost</dt><dd>' + esc(r.cost) + '</dd>' +
            '<dt>Heroes</dt><dd><span class="rec-heroes">' +
            each(r.heroes, function (h) { return '<button class="linkish"' + on(h.open, 'rec:' + r.rank + ':' + h.name) + '>' + esc(h.name) + '</button>'; }) +
            when(r.noHeroes, '<span class="mini">None named</span>') + '</span></dd></dl>' +
            when(r.hasSteps, '<ol class="rec-steps">' + each(r.steps, function (t) { return '<li>' + esc(t.text) + '</li>'; }) + '</ol>') +
            when(r.hasChanges, '<div class="chgs">' + each(r.changes, function (c) {
              return '<div class="chg"><span class="chg-w">' + esc(c.where) + '</span>' +
                (c.tabular
                  ? '<table class="chg-t"><thead><tr><th scope="col"><span class="sr">Group</span></th><th scope="col">Now</th><th scope="col">Suggested</th></tr></thead><tbody>' +
                    each(c.rows, function (row) {
                      return '<tr><th scope="row">' + esc(row.label) + '</th><td>' + tplToks(row.before, row.beforeEmpty) + '</td><td>' + tplToks(row.after, false) + '</td></tr>';
                    }) + '</tbody></table>'
                  : '<div class="chg-r"><span class="chg-l">Now</span>' + tplToks(c.rows[0].before, c.rows[0].beforeEmpty) + '</div>' +
                    '<div class="chg-r"><span class="chg-l">Suggested</span>' + tplToks(c.rows[0].after, false) + '</div>') +
                when(c.hasNote, '<span class="foot">' + esc(c.note) + '</span>') + '</div>';
            }) + '</div>') +
            when(r.hasEvidence, '<ul class="rec-ev">' + each(r.evidence, function (e) { return '<li>' + esc(e.text) + '</li>'; }) + '</ul>') +
            when(r.hasNote, '<p class="foot">' + esc(r.note) + '</p>') +
            '</section>';
        }) + '</div>';
    }) +
    when(iv.empty, '<p class="empty">No recommendations match these filters.</p>') +
    '</div>';
}

/**
 * View 8 — Features: one card per game system.
 * @param {object} v
 * @returns {string}
 */
function tplFeatures(v) {
  return '<div class="view">' +
    '<div class="view-h"><h2>Features</h2><p class="lede">' + esc(v.featMeta.lede) + '</p></div>' +
    '<div class="fgrid">' + each(v.features, function (f) {
      return '<div class="feat"><div class="feat-h"><h4>' + esc(f.name) + '</h4><span class="state ' + esc(f.stateCls) + '">' + esc(f.state) + '</span></div>' +
        '<dl class="kv"><dt>Unlock</dt><dd>' + esc(f.unlockText) + '</dd><dt>Data</dt><dd class="' + esc(f.dataCls) + '">' + esc(f.dataText) + '</dd>' +
        '<dt>Age</dt><dd>' + esc(f.ageText) + '</dd></dl>' +
        when(f.hasNote, '<p class="foot">' + esc(f.note) + '</p>') + '</div>';
    }) + '</div>' +
    '<p class="foot">' + esc(v.featMeta.ruleNote) + '</p></div>';
}

/**
 * View 9 — Data health: conflicts, missing, stale.
 * @param {object} v
 * @returns {string}
 */
function tplHealth(v) {
  var h = v.health;
  var item = function (x, withDetail) {
    return '<div class="item"><div class="item-h"><span class="item-t">' + esc(x.title) + '</span><span class="item-a">' + esc(x.area) + '</span></div>' +
      when(withDetail && x.detail, '<p>' + esc(x.detail) + '</p>') + '</div>';
  };
  return '<div class="view">' +
    '<div class="view-h"><h2>Data health</h2><p class="lede">' + esc(h.lede) + '</p></div>' +
    '<section class="panel"><div class="panel-h"><h3>Conflicts</h3><span class="asof">' + esc(h.conflictCount) + '</span></div>' +
    '<div class="list">' + each(h.conflicts, function (c) { return item(c, true); }) + '</div>' +
    when(!h.conflicts.length, '<p class="empty">No conflicts found.</p>') + '</section>' +
    '<div class="grid2">' +
    '<section class="panel"><div class="panel-h"><h3>Missing</h3><span class="asof">' + esc(h.missingCount) + '</span></div>' +
    '<div class="list">' + each(h.missing, function (m) { return item(m, false); }) + '</div></section>' +
    '<section class="panel"><div class="panel-h"><h3>Stale or undated</h3><span class="asof">' + esc(h.staleCount) + '</span></div>' +
    '<div class="list">' + each(h.stale, function (s) { return item(s, true); }) + '</div>' +
    when(h.noStale, '<p class="empty">Nothing older than the stale limit.</p>') + '</section>' +
    '</div></div>';
}

/**
 * View 10 — Gift codes.
 * @param {object} v
 * @returns {string}
 */
function tplCodes(v) {
  var c = v.codes;
  // Each code is a toggle button (aria-pressed = redeemed). Rows without a code name stay plain text.
  var row = function (x) {
    var inner = '<span class="cbox" aria-hidden="true">' + (x.pressed === 'true' ? '✓' : '') + '</span>' +
      '<span class="code">' + esc(x.code) + '</span>' +
      '<span class="code-st"><span class="' + esc(x.cls) + '">' + esc(x.state) + '</span>' +
      when(x.local, '<span class="code-local">This device</span>') + '</span>';
    if (!x.toggle) return '<div class="code-row">' + inner + '</div>';
    return '<button class="code-row" aria-pressed="' + esc(x.pressed) + '" aria-label="' + esc(x.label) + '"' + on(x.toggle, 'code:' + x.code) + '>' + inner + '</button>';
  };
  return '<div class="view">' +
    '<div class="view-h"><h2>Gift codes</h2><p class="lede">' + esc(c.lede) + '</p></div>' +
    '<section class="panel"><p class="foot">Tap a code to mark it redeemed or not. Marks are saved in this browser only, so other devices won\'t see them until codes.md is updated.</p>' +
    when(c.hasPending, '<p class="foot code-pend">' + esc(c.pendingText) + '</p>' +
      '<button class="linkish"' + on(c.clearMarks, 'code-clear') + '>Clear marks on this device</button>') +
    '</section>' +
    '<div class="grid2">' +
    '<section class="panel"><div class="panel-h"><h3>Active</h3><span class="asof">' + esc(c.asOf) + '</span></div>' +
    '<div class="codes">' + each(c.active, row) + '</div>' +
    when(c.noActive, '<p class="empty">No active codes recorded.</p>') + '</section>' +
    '<section class="panel"><div class="panel-h"><h3>Expired</h3><span class="asof">' + esc(c.expiredCount) + '</span></div>' +
    '<div class="codes">' + each(c.expired, row) + '</div>' +
    when(c.unlistedText, '<p class="foot" style="margin-top:10px">' + esc(c.unlistedText) + '</p>') + '</section>' +
    '</div></div>';
}

/**
 * Hero detail drawer (side panel on desktop, bottom sheet on phone).
 * @param {object} v
 * @returns {string}
 */
function tplDrawer(v) {
  var d = v.drawer;
  if (!d.open) return '';
  return '<div class="drawer-wrap">' +
    '<button class="scrim" tabindex="-1"' + on(v.closeHero, 'scrim') + ' aria-label="Close hero details"></button>' +
    '<aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(d.name) + ' details">' +
    '<div class="dr-h"><div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
    '<span class="hc-meta"><span class="rar ' + esc(d.rarCls) + '">' + esc(d.rarity) + '</span><span>' + esc(d.cls) + '</span><span>' + esc(d.genText) + '</span>' +
    when(d.isNew, '<span class="badge-new">New</span>') + '</span>' +
    '<h2>' + esc(d.name) + '</h2><span class="asof">' + esc(d.asOf) + '</span></div>' +
    '<button class="x-btn"' + on(v.closeHero, 'drawer-close') + ' aria-label="Close">' + ICON_CLOSE + '</button></div>' +
    '<dl class="kv"><dt>Level</dt><dd>' + esc(d.levelText) + '</dd><dt>Stars / tier</dt><dd>' + esc(d.starsText) + '</dd>' +
    '<dt>Shards</dt><dd>' + esc(d.shardText) + '</dd><dt>Hero power</dt><dd>' + esc(d.powerText) + '</dd>' +
    '<dt>Gear power</dt><dd>' + esc(d.gearText) + '</dd><dt>Role</dt><dd>' + esc(d.roleText) + '</dd></dl>' +
    '<div class="dr-sec"><h3>Gear slots</h3>' +
    each(d.slots, function (s) { return '<div class="slot-row ' + esc(s.cls) + '"><span>' + esc(s.slot) + '</span><span class="slot-st">' + esc(s.stateText) + '</span></div>'; }) +
    '<p class="foot">' + esc(d.slotsNote) + '</p>' +
    when(d.hasGearNote, '<p class="foot">' + esc(d.gearNote) + '</p>') +
    '<p class="foot">Widget: ' + esc(d.widgetText) + '</p></div>' +
    '<div class="dr-sec"><h3>Skills</h3>' +
    each(d.skills, function (k) {
      return '<div class="sk-row"><span class="sk-name">' + esc(k.name) + '</span>' +
        '<span class="move-m"><span class="st ' + esc(k.stCls) + '">' + esc(k.statusText) + '</span>' +
        when(k.hasConf, '<span class="' + esc(k.confCls) + '">' + esc(k.conf) + '</span>') + '</span>' +
        '<span class="sk-note">' + esc(k.note) + '</span></div>';
    }) +
    when(d.noSkills, '<p class="empty">Skills: Not recorded.</p>') +
    when(d.hasBookRule && !d.noSkills, '<p class="foot">' + esc(d.bookRule) + '</p>') + '</div>' +
    '<div class="dr-sec"><h3>Assignments</h3><div class="chips-s">' +
    each(d.assign, function (a) { return '<span class="chip-s">' + esc(a.label) + '</span>'; }) + '</div>' +
    when(d.noAssign, '<p class="empty">No assignments recorded.</p>') + '</div>' +
    when(d.hasNotes, '<div class="dr-sec"><h3>Notes</h3><ul class="rec-ev" style="color:var(--ink)">' +
      each(d.notes, function (n) { return '<li>' + esc(n.text) + '</li>'; }) + '</ul></div>') +
    '</aside></div>';
}

/** View id → template function. */
var VIEWS = {
  overview: tplOverview, heroes: tplHeroes, drill: tplDrill, army: tplArmy, defense: tplDefense,
  city: tplCity, invest: tplInvest, features: tplFeatures, health: tplHealth, codes: tplCodes
};

/* =====================================================================
 * App wiring: one render function, one delegated click listener,
 * focus restoration, Escape-to-close, persisted theme and gift-code marks.
 * ===================================================================== */

var app = new Dashboard();
var root = document.getElementById('app');

// Restore the viewer's theme choice. Storage can be blocked (private mode); fall back to "auto".
try {
  var savedTheme = window.localStorage.getItem('ks-theme');
  if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'auto') app.state.theme = savedTheme;
} catch (err) { /* storage unavailable: keep default */ }

// Restore the viewer's gift-code marks. Bad JSON or blocked storage leaves codes.md as the only source.
try {
  app.state.codeMarks = app.pruneCodeMarks(JSON.parse(window.localStorage.getItem('ks-code-marks') || '{}'));
} catch (err) { app.state.codeMarks = {}; }

/**
 * Side effects of a state change that the logic class should not know about:
 * theme and gift-code-mark persistence, scroll reset on view change, drawer focus management.
 * @param {object} prev State before the change.
 * @param {object} next State after the change.
 * @returns {void}
 */
function afterStateChange(prev, next) {
  if (prev.theme !== next.theme) {
    try { window.localStorage.setItem('ks-theme', next.theme); } catch (err) { /* ignore */ }
  }
  if (prev.codeMarks !== next.codeMarks) {
    // Storage can be full or blocked; the marks then last until the page is closed.
    try {
      if (Object.keys(next.codeMarks).length) window.localStorage.setItem('ks-code-marks', JSON.stringify(next.codeMarks));
      else window.localStorage.removeItem('ks-code-marks');
    } catch (err) { /* ignore */ }
  }
  if (prev.view !== next.view) window.scrollTo(0, 0);
  if (!prev.hero && next.hero) { drawerOpener = lastClickKey; pendingFocus = 'drawer-close'; }
  if (prev.hero && !next.hero) { pendingFocus = drawerOpener; drawerOpener = null; }
}

/**
 * Render the whole page from the current state. Cheap enough for this
 * data size (≤60 heroes), and keeps the page free of a diffing library.
 * @returns {void}
 */
function render() {
  var active = document.activeElement;
  var focusKey = pendingFocus || (active && active.getAttribute ? active.getAttribute('data-fk') : null);
  pendingFocus = null;
  handlers = [];
  var v = app.renderVals();
  document.body.className = 'ks theme-' + v.themeClass;
  // Lock page scroll behind the open drawer.
  document.body.style.overflow = v.drawer.open ? 'hidden' : '';
  var tpl = VIEWS[app.state.view] || tplOverview;
  root.innerHTML = tplHeader(v) +
    '<div class="shell">' + tplNav(v) + '<main class="main">' + tpl(v) + '</main></div>' +
    tplDrawer(v);
  if (focusKey) {
    var el = root.querySelector('[data-fk="' + (window.CSS && CSS.escape ? CSS.escape(focusKey) : focusKey) + '"]');
    if (el) el.focus({ preventScroll: true });
  }
}

// One delegated listener for every button rendered by on().
root.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-h]');
  if (!el) return;
  var fn = handlers[Number(el.getAttribute('data-h'))];
  lastClickKey = el.getAttribute('data-fk');
  if (typeof fn === 'function') fn();
});

// Escape closes the hero drawer.
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && app.state.hero) app.setState({ hero: null });
});

// Follow system theme changes live while in "auto".
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (app.state.theme === 'auto') render(); });
} catch (err) { /* older browsers: theme updates on next interaction */ }

render();
</script>
